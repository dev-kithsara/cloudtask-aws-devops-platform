name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @cloudtask/api
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t cloudtask-api:${{ github.sha }} .
      - name: Scan API container
        env:
          IMAGE_REF: cloudtask-api:${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm --pull=always \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.75.0 image \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE_REF"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Validate bootstrap
        working-directory: infra/bootstrap/terraform
        run: terraform init -backend=false && terraform validate
      - name: Prepare Lambda archive for static validation
        run: zip -j functions/audit-consumer/dist/audit-consumer.zip functions/audit-consumer/dist/index.js
      - name: Validate demo environment
        working-directory: infra/terraform/environments/demo
        run: terraform init -backend=false && terraform validate
