name: Deploy demo

on:
  workflow_dispatch:
    inputs:
      enable_governance:
        description: Enable temporary AWS Config evidence resources
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudtask-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @cloudtask/api
      - run: npm test
      - run: npm run build
      - name: Package Lambda
        run: zip -j functions/audit-consumer/dist/audit-consumer.zip functions/audit-consumer/dist/index.js
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Check if API image already exists in ECR
        id: ecr_check
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPO: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          REPO_NAME="${ECR_REPO##*/}"
          REGISTRY="${ECR_REPO%%/*}"
          if aws ecr describe-images \
               --repository-name "$REPO_NAME" \
               --image-ids imageTag="$IMAGE_TAG" \
               --region "$AWS_REGION" \
               --output text > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_TAG already exists in ECR — skipping build, scan and push."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and scan immutable API image
        if: steps.ecr_check.outputs.exists != 'true'
        env:
          IMAGE_URI: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          for attempt in 1 2 3; do
            if docker build -f apps/api/Dockerfile -t "$IMAGE_URI" .; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Docker build failed on attempt $attempt; retrying..."
              sleep 10
            fi
          done
          exit 1
      - name: Scan API container
        if: steps.ecr_check.outputs.exists != 'true'
        env:
          IMAGE_REF: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm --pull=always \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
            aquasec/trivy:0.75.0 image \
            --pkg-types os \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$IMAGE_REF"
      - name: Push API image
        if: steps.ecr_check.outputs.exists != 'true'
        env:
          IMAGE_URI: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          ECR_REPO: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          if ! docker push "$IMAGE_URI"; then
            REPO_NAME="${ECR_REPO##*/}"
            if aws ecr describe-images \
                 --repository-name "$REPO_NAME" \
                 --image-ids imageTag="${{ github.sha }}" \
                 --region "$AWS_REGION" \
                 --output text > /dev/null 2>&1; then
              echo "Image tag ${{ github.sha }} was verified in ECR."
            else
              echo "Failed to push image to ECR."
              exit 1
            fi
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Initialize remote state
        working-directory: infra/terraform/environments/demo
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=cloudtask/demo/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Terraform plan
        working-directory: infra/terraform/environments/demo
        run: terraform plan -out=demo.tfplan -var="owner=${{ vars.PROJECT_OWNER }}" -var="image_uri=${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}" -var="alert_email=${{ vars.ALERT_EMAIL }}" -var="enable_governance=${{ inputs.enable_governance }}"
      - name: Terraform apply
        working-directory: infra/terraform/environments/demo
        run: terraform apply -auto-approve demo.tfplan
      - name: Read deployment outputs
        id: outputs
        working-directory: infra/terraform/environments/demo
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"
      - name: Build frontend for deployed API
        env:
          VITE_API_BASE_URL: ${{ steps.outputs.outputs.api_url }}
        run: npm run build -w @cloudtask/frontend
      - name: Upload frontend and invalidate cache
        run: |
          aws s3 sync apps/frontend/dist "s3://${{ steps.outputs.outputs.bucket }}" --delete
          aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.distribution }}" --paths "/*"
      - name: Smoke test API health
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "${{ steps.outputs.outputs.api_url }}/health"; then exit 0; fi
            sleep 15
          done
          exit 1
      - name: Deployment summary
        run: |
          echo "Frontend: ${{ steps.outputs.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API: ${{ steps.outputs.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ Collect evidence and run Destroy demo on the same day." >> "$GITHUB_STEP_SUMMARY"
